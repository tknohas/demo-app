<!DOCTYPE html>
<html xmlns:h="jakarta.faces.html" xmlns:p="primefaces">
  <h:head>
    <title>明細ページ</title>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css" />
  </h:head>
  <h:body>
    <h2>明細の作成</h2>
    <h:form>
      <div class="ui-fluid">
        <div class="field">
          <h:outputText for="title-input" value="タイトル" />
          <p:inputText id="title-input" value="#{reportNewBean.title}" />
          <h:message for="title-input" style="color: red;" />
        </div>
        <div class="field">
          <h:outputText for="title-detail" value="詳細" />
          <p:inputText id="title-detail" value="#{reportNewBean.detail}" rows="6" />
        </div>
      </div>
      <div class="flex justify-content-center">
        <p:commandButton value="送信" action="#{reportNewBean.create()}" ajax="false" />
      </div>
    </h:form>
  </h:body>
</html>
