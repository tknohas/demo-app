<!DOCTYPE html>
<html xmlns:h="jakarta.faces.html" xmlns:p="primefaces">
  <h:head>
    <title>一覧ページ</title>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css" />
  </h:head>
  <h:body>
    <h2>明細の一覧</h2>
    <h:form>
      <div class="card">
        <p:dataTable value="#{reportListBean.reports}" var="report">
          <p:column headerText="タイトル">
            <h:outputText value="#{report.title}" />
          </p:column>
        </p:dataTable>
      </div>
    </h:form>
  </h:body>
</html>
